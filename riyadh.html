<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riyadh Neon Wireframe Cityscape — Watch Code Draw Live</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      background: radial-gradient(circle at 50% 15%, #071f56 0%, #020b24 70%, #010614 100%);
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .canvas-stage {
      background: #000b31;
    }
    /* Mobile-width column: the artwork fills it top to bottom */
    #cityCanvas {
      position: fixed;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      display: block;
      width: var(--app-w);
      height: 100vh;
      height: 100dvh;
      object-fit: cover;
      object-position: center;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.55);
    }
    /* Blurred copy of the artwork filling the rest of the screen */
    #bgCanvas {
      position: fixed;
      inset: -40px;
      display: block;
      width: calc(100vw + 80px);
      height: calc(100vh + 80px);
      height: calc(100dvh + 80px);
      object-fit: cover;
      filter: blur(28px) brightness(0.55) saturate(1.2);
    }

    /* =========================================================
     * PREMIUM GLASS SALES-REPRESENTATIVE CARDS
     * ========================================================= */
    .reps-panel {
      --text-main: #f8fcff;
      --accent: #7dd3fc;
      position: fixed;
      z-index: 20;
      top: calc(50% + var(--logo-space) / 2);
      left: 50%;
      width: calc(var(--app-w) - 24px);
      display: flex;
      flex-direction: column;
      font-family: 'Cairo', system-ui, sans-serif;
      color: var(--text-main);
      transform: translate(-50%, -50%);
      visibility: hidden;
    }
    /* Shown once the background drawing has finished (see showReps) */
    .reps-panel.is-ready {
      visibility: visible;
      animation: reps-panel-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes reps-panel-in {
      from {
        opacity: 0;
        transform: translate(-50%, calc(-50% + 24px)) scale(0.98);
      }
    }
    .reps-header {
      flex: none;
      margin: 0 4px 12px;
      padding: 12px 16px;
      border-radius: 20px;
      text-align: center;
      text-shadow: 0 2px 12px rgba(0, 12, 40, 0.7);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.07) 60%, rgba(255, 255, 255, 0.12) 100%),
        rgba(6, 24, 66, 0.55);
      backdrop-filter: blur(16px) saturate(170%);
      -webkit-backdrop-filter: blur(16px) saturate(170%);
      border: 1px solid rgba(255, 255, 255, 0.26);
      box-shadow:
        0 10px 30px rgba(0, 6, 28, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }
    .reps-title {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      line-height: 1.3;
      color: #ffffff;
    }
    .reps-panel.is-ready .reps-header {
      animation: reps-row-in 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .reps-body {
      flex: none;
      overflow: visible;
      padding: 4px;
    }
    .reps-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .reps-user {
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      text-shadow: 0 1px 6px rgba(0, 12, 40, 0.55);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.06) 60%, rgba(255, 255, 255, 0.1) 100%),
        rgba(6, 24, 66, 0.55);
      backdrop-filter: blur(16px) saturate(170%);
      -webkit-backdrop-filter: blur(16px) saturate(170%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow:
        0 10px 30px rgba(0, 6, 28, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .reps-panel.is-ready .reps-user {
      animation: reps-row-in 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: calc(0.2s + var(--i) * 0.2s);
    }
    @keyframes reps-row-in {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
    }
    /* Hover: much less transparent (base layer 0.55 -> 0.92 opacity) */
    .reps-user:hover {
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.08) 60%, rgba(255, 255, 255, 0.12) 100%),
        rgba(6, 24, 66, 0.92);
      border-color: rgba(255, 255, 255, 0.34);
    }
    .reps-idx {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }
    .reps-name {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-weight: 700;
    }
    .reps-avatar {
      flex: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.35);
    }
    .reps-phone {
      color: #e0f2fe;
      text-decoration: none;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      unicode-bidi: isolate;
    }
    .reps-phone:hover { color: #ffffff; }
    .reps-actions {
      display: flex;
      gap: 4px;
    }
    .reps-action {
      display: inline-grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }
    .reps-action:hover { transform: translateY(-2px); }
    .reps-action.call:hover {
      background: rgba(56, 189, 248, 0.35);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.6);
    }
    .reps-action.whatsapp:hover {
      background: rgba(34, 197, 94, 0.35);
      box-shadow: 0 0 14px rgba(34, 197, 94, 0.6);
    }
    .reps-action:focus-visible,
    .reps-phone:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .reps-action svg { width: 15px; height: 15px; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    @media (max-width: 640px) {
      .reps-list { gap: 8px; }
      .reps-title { font-size: 20px; }
      .reps-user {
        gap: 10px;
        padding: 9px 12px;
        font-size: 13px;
      }
    }
    @media (max-width: 380px) {
      .reps-avatar { display: none; }
      .reps-user { gap: 8px; padding: 8px 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .reps-panel.is-ready,
      .reps-panel.is-ready .reps-header,
      .reps-panel.is-ready .reps-user {
        animation: none;
      }
    }

    /* =========================================================
     * LOGO INTRO: centered on blue, then glides to the top edge
     * ========================================================= */
    :root {
      --logo-space: 96px; /* room kept free for the logo at the top */
      --app-w: min(100vw, 480px); /* max width of the page column */
    }
    .intro-bg {
      position: fixed;
      inset: 0;
      z-index: 30;
      pointer-events: none;
      background: radial-gradient(circle at 50% 45%, #1d6cf2 0%, #0a3fb8 45%, #041a5e 100%);
      animation: intro-bg 2s ease both;
    }
    @keyframes intro-bg {
      0%, 55% { opacity: 1; visibility: visible; }
      100% { opacity: 0; visibility: hidden; }
    }
    .intro-logo {
      position: fixed;
      z-index: 40;
      left: calc(50% - var(--app-w) / 2 + 16px);
      top: 16px;
      width: 190px;
      aspect-ratio: 895 / 279;
      display: grid;
      place-items: center;
      transform: none;
      animation: intro-logo 2s cubic-bezier(0.65, 0, 0.35, 1) both;
    }
    .intro-logo img {
      width: 100%;
      height: auto;
      display: block;
    }
    /* The plate animates its real width (not scale) so the logo stays sharp */
    @keyframes intro-logo {
      0% { left: 50%; top: 50%; width: min(380px, 70vw); transform: translate(-50%, -50%); opacity: 0; }
      18% { left: 50%; top: 50%; width: min(640px, 90vw); transform: translate(-50%, -50%); opacity: 1; }
      55% { left: 50%; top: 50%; width: min(640px, 90vw); transform: translate(-50%, -50%); opacity: 1; }
      100% { left: calc(50% - var(--app-w) / 2 + 16px); top: 16px; width: 190px; transform: translate(0, 0); opacity: 1; }
    }
    @media (max-width: 640px) {
      :root { --logo-space: 72px; }
      .intro-logo { left: calc(50% - var(--app-w) / 2 + 10px); top: 10px; width: 140px; }
      @keyframes intro-logo {
        0% { left: 50%; top: 50%; width: min(380px, 70vw); transform: translate(-50%, -50%); opacity: 0; }
        18% { left: 50%; top: 50%; width: min(640px, 90vw); transform: translate(-50%, -50%); opacity: 1; }
        55% { left: 50%; top: 50%; width: min(640px, 90vw); transform: translate(-50%, -50%); opacity: 1; }
        100% { left: calc(50% - var(--app-w) / 2 + 10px); top: 10px; width: 140px; transform: translate(0, 0); opacity: 1; }
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .intro-bg { display: none; }
      .intro-logo { animation: none; }
    }
  </style>
</head>

    let qMatrix = null; // Uint8Array(W * H) with palette indices 0..47

    const canvas = document.getElementById('cityCanvas');
    const ctx = canvas.getContext('2d');

    // =========================================================================
    // 2. DECODE & UNFILTER THE 941x1672 PIXEL MATRIX IN PURE JAVASCRIPT
    // =========================================================================
    function decodeMatrixSynchronously() {
      const binStr = atob(MATRIX_B64);
      const len = binStr.length;
      const compressedBytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        compressedBytes[i] = binStr.charCodeAt(i);
      }

      // Decompress zlib stream via pako
      const filtered = window.pako.inflate(compressedBytes);
      const out = new Uint8Array(W * H);

      let srcOffset = 0;
      for (let y = 0; y < H; y++) {
        const filterType = filtered[srcOffset++];
        const rowOffset = y * W;
        const prevRowOffset = (y - 1) * W;

        if (filterType === 1) {
          // Sub filter
          for (let x = 0; x < W; x++) {
            const a = x > 0 ? out[rowOffset + x - 1] : 0;
            out[rowOffset + x] = (filtered[srcOffset++] + a) & 0xFF;
          }
        } else if (filterType === 2) {
          // Up filter
          for (let x = 0; x < W; x++) {
            const b = y > 0 ? out[prevRowOffset + x] : 0;
            out[rowOffset + x] = (filtered[srcOffset++] + b) & 0xFF;
          }
        } else if (filterType === 3) {
          // Paeth filter
          for (let x = 0; x < W; x++) {
            const a = x > 0 ? out[rowOffset + x - 1] : 0;
            const b = y > 0 ? out[prevRowOffset + x] : 0;
            const c = (x > 0 && y > 0) ? out[prevRowOffset + x - 1] : 0;
            const p = a + b - c;
            const pa = Math.abs(p - a);
            const pb = Math.abs(p - b);
            const pc = Math.abs(p - c);
            const pr = (pa <= pb && pa <= pc) ? a : (pb <= pc ? b : c);
            out[rowOffset + x] = (filtered[srcOffset++] + pr) & 0xFF;
          }
        }
      }
      return out;
    }

    // Exact pixel render of the finished artwork (identical to the original exact mode)
    function renderFinal(targetCtx) {
      const imgData = targetCtx.createImageData(W, H);
      const data = imgData.data;
      const total = W * H;

      for (let i = 0; i < total; i++) {
        const rgb = PALETTE[qMatrix[i]];
        const p = i << 2;
        data[p] = rgb[0];
        data[p + 1] = rgb[1];
        data[p + 2] = rgb[2];
        data[p + 3] = 255;
      }

      targetCtx.putImageData(imgData, 0, 0);
    }

    // Trace the outlines of the neon pixels (palette index >= level) into closed
    // polylines along pixel edges, keeping only the corner points
    function traceNeonOutlines(level, minEdges) {
      const VW = W + 1;
      const nextA = new Int32Array(VW * (H + 1)).fill(-1);
      const nextB = new Int32Array(VW * (H + 1)).fill(-1);
      const inside = (x, y) => x >= 0 && y >= 0 && x < W && y < H && qMatrix[y * W + x] >= level;
      const addEdge = (x1, y1, x2, y2) => {
        const from = y1 * VW + x1;
        if (nextA[from] === -1) nextA[from] = y2 * VW + x2;
        else nextB[from] = y2 * VW + x2;
      };

      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          if (!inside(x, y)) continue;
          if (!inside(x, y - 1)) addEdge(x, y, x + 1, y);
          if (!inside(x + 1, y)) addEdge(x + 1, y, x + 1, y + 1);
          if (!inside(x, y + 1)) addEdge(x + 1, y + 1, x, y + 1);
          if (!inside(x - 1, y)) addEdge(x, y + 1, x, y);
        }
      }

      const outlines = [];
      for (let start = 0; start < nextA.length; start++) {
        // A saddle corner can start two separate loops
        while (nextA[start] !== -1) {
          const pts = [];
          let v = start;
          let pdx = 2;
          let pdy = 2;
          let edges = 0;
          while (true) {
            const n = nextA[v];
            if (n === -1) break;
            nextA[v] = nextB[v];
            nextB[v] = -1;
            const vx = v % VW;
            const vy = (v / VW) | 0;
            const dx = (n % VW) - vx;
            const dy = ((n / VW) | 0) - vy;
            if (dx !== pdx || dy !== pdy) {
              pts.push([vx, vy]);
              pdx = dx;
              pdy = dy;
            }
            edges++;
            v = n;
            if (v === start) break;
          }
          pts.push([start % VW, (start / VW) | 0]);
          if (edges >= minEdges) outlines.push(pts);
        }
      }
      return outlines;
    }

    /* ==========================================
     * LIVE DRAWING — PEN SKETCH, THEN INK
     * A pen traces the outlines of the neon lines from left to right and the
     * finished colors flow in behind it. The last frame is the exact pixel
     * render, so no detail of the image changes.
     * ========================================== */
    const SKETCH_LEVELS = [30]; // palette brightness levels the pen outlines
    const MIN_OUTLINE_EDGES = 16; // skip tiny specks
    const SKETCH_BG = '#00092b';
    const BAND_W = 70; // the pen works across the image in vertical bands
    const SKETCH_MS = 1650; // time the pen spends drawing
    const FINISH_MS = 400; // color catch-up after the pen lifts
    const INK_LAG = 140; // how far the color trails behind the pen (px)
    const FEATHER = 110; // softness of the color edge (px)
    const MAX_STEP_MS = 1000 / 30; // a slow frame can't skip the animation ahead

    function makeLayerCanvas() {
      const c = document.createElement('canvas');
      c.width = W;
      c.height = H;
      return [c, c.getContext('2d')];
    }
    const [finalCanvas, finalCtx] = makeLayerCanvas(); // exact finished artwork
    const [sketchCanvas, sketchCtx] = makeLayerCanvas(); // pen lines accumulate here
    const [inkCanvas, inkCtx] = makeLayerCanvas(); // masked color wash

    const strokes = [];
    let totalPenVerts = 0;
    let drawnPenVerts = 0;
    let strokeIdx = 0;
    let vertIdx = 0;
    let penX = 0;
    let penY = H / 2;
    let inkEdge = -FEATHER;
    let lastTime = null;
    let elapsed = 0;

    function prepareDrawing() {
      renderFinal(finalCtx);

      sketchCtx.fillStyle = SKETCH_BG;
      sketchCtx.fillRect(0, 0, W, H);
      sketchCtx.strokeStyle = 'rgba(125, 211, 252, 0.9)';
      sketchCtx.lineWidth = 1.1;
      sketchCtx.lineJoin = 'round';
      sketchCtx.lineCap = 'round';
      sketchCtx.shadowColor = 'rgba(56, 189, 248, 0.9)';
      sketchCtx.shadowBlur = 4;

      // Split every outline into runs that stay inside one band, so long
      // lines get drawn piece by piece as the pen reaches them
      SKETCH_LEVELS.forEach((level) => {
        traceNeonOutlines(level, MIN_OUTLINE_EDGES).forEach((pts) => {
          const bandAt = (j) => Math.floor(pts[j][0] / BAND_W);
          let runStart = 0;
          let sy = pts[0][1];
          for (let j = 1; j < pts.length; j++) {
            sy += pts[j][1];
            if (j === pts.length - 1 || bandAt(j + 1) !== bandAt(j)) {
              const count = j - runStart + 1;
              strokes.push({ pts, start: runStart, count, band: bandAt(j), cy: sy / count });
              totalPenVerts += count;
              runStart = j;
              sy = pts[j][1];
            }
          }
        });
      });
      // Left to right in bands, snaking down then up so the pen moves naturally
      strokes.sort((a, b) => a.band - b.band || (a.band % 2 ? b.cy - a.cy : a.cy - b.cy));

      ctx.drawImage(sketchCanvas, 0, 0);
    }

    function advancePen(targetVerts) {
      if (drawnPenVerts >= targetVerts) return;
      sketchCtx.beginPath();
      while (drawnPenVerts < targetVerts && strokeIdx < strokes.length) {
        const s = strokes[strokeIdx];
        const p = s.pts[s.start + vertIdx];
        penX = p[0];
        penY = p[1];
        if (vertIdx === 0) sketchCtx.moveTo(penX, penY);
        else sketchCtx.lineTo(penX, penY);
        vertIdx++;
        drawnPenVerts++;
        if (vertIdx >= s.count) {
          strokeIdx++;
          vertIdx = 0;
        }
      }
      sketchCtx.stroke();
    }

    function drawPenTip() {
      const glow = ctx.createRadialGradient(penX, penY, 0, penX, penY, 22);
      glow.addColorStop(0, 'rgba(165, 243, 252, 0.75)');
      glow.addColorStop(1, 'rgba(34, 211, 238, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(penX, penY, 22, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(penX, penY, 2.4, 0, Math.PI * 2);
      ctx.fill();
    }

    function renderDrawingFrame(t) {
      const sketchT = Math.min(1, t / SKETCH_MS);
      advancePen(Math.floor(sketchT * totalPenVerts));
      const penDone = strokeIdx >= strokes.length;

      let inkTarget;
      if (!penDone) {
        inkTarget = strokes[strokeIdx].band * BAND_W - INK_LAG;
      } else {
        const f = Math.min(1, Math.max(0, (t - SKETCH_MS) / FINISH_MS));
        inkTarget = W + FEATHER * (0.5 + 1.5 * f);
      }
      inkEdge += (inkTarget - inkEdge) * 0.12;

      if (penDone && inkEdge >= W + FEATHER) {
        ctx.drawImage(finalCanvas, 0, 0);
        return true;
      }

      ctx.drawImage(sketchCanvas, 0, 0);

      if (inkEdge > -FEATHER) {
        inkCtx.globalCompositeOperation = 'copy';
        inkCtx.drawImage(finalCanvas, 0, 0);
        const mask = inkCtx.createLinearGradient(inkEdge - FEATHER, 0, inkEdge, 0);
        mask.addColorStop(0, 'rgba(0, 0, 0, 1)');
        mask.addColorStop(1, 'rgba(0, 0, 0, 0)');
        inkCtx.globalCompositeOperation = 'destination-in';
        inkCtx.fillStyle = mask;
        inkCtx.fillRect(0, 0, W, H);
        ctx.drawImage(inkCanvas, 0, 0);
      }

      if (!penDone) drawPenTip();
      return false;
    }

    // Mirror the artwork into the small blurred backdrop canvas
    const bgCtx = document.getElementById('bgCanvas').getContext('2d');
    function copyToBackdrop() {
      bgCtx.drawImage(canvas, 0, 0, bgCtx.canvas.width, bgCtx.canvas.height);
    }

    // Reveal the sales reps one by one after the background animation ends
    function showReps() {
      document.getElementById('repsPanel').classList.add('is-ready');
    }

    function tick(now) {
      if (lastTime === null) lastTime = now;
      elapsed += Math.min(now - lastTime, MAX_STEP_MS);
      lastTime = now;
      const finished = renderDrawingFrame(elapsed);
      copyToBackdrop();
      if (!finished) requestAnimationFrame(tick);
      else showReps();
    }

    // Initialize on load
    window.addEventListener('DOMContentLoaded', () => {
      qMatrix = decodeMatrixSynchronously();
      prepareDrawing();
      startDrawingAfterIntro();
    });
  </script>
</body>
</html>
