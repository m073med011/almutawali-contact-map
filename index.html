<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>مندوبو المتولي</title>
  <meta name="theme-color" content="#020617">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Tajawal', 'system-ui', 'sans-serif'] },
          colors: { brand: { DEFAULT: '#3ba7e0', dark: '#1d6fa5' } },
        },
      },
    };
  </script>

  <!-- MapLibre GL (3D terrain map) -->
  <link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- Data -->
  <script src="js/data.js"></script>
  <script src="js/regions.js"></script>
  <script src="js/places.js"></script>

  <style>
    :root {
      --ink: #0b1220;
      --ink-2: #475569;
      --paper: rgba(255, 255, 255, .97);
      --shadow: 0 14px 34px -10px rgba(0, 0, 0, .7), 0 2px 6px -2px rgba(0, 0, 0, .35);
    }
    html, body { height: 100%; }
    body { background: #020617; overflow: hidden; }
    #map { position: fixed; inset: 0; }
    #map canvas { outline: none; }
    /* MapLibre sets its own Helvetica/Arial font on the map; markers and cards should use the page font. */
    .maplibregl-map, .maplibregl-map button { font-family: 'Tajawal', system-ui, sans-serif; }

    /* Cinematic edge shading over the map */
    #vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 1;
      background:
        radial-gradient(120% 95% at 50% 48%, transparent 58%, rgba(2, 6, 23, .82) 100%),
        linear-gradient(to bottom, rgba(2, 6, 23, .55), transparent 18%, transparent 82%, rgba(2, 6, 23, .6));
    }

    /* Solid instead of frosted glass: a backdrop blur behind every moving pin is very costly on phones. */
    .paper {
      background: var(--paper);
      border: 1px solid rgba(255, 255, 255, .75);
      box-shadow: var(--shadow);
      color: var(--ink);
    }
    .grad { background: linear-gradient(135deg, var(--c), var(--c2)); }

    /* ---------- Place names, in the style of classic Arabic atlases ---------- */
    .pl { pointer-events: none; white-space: nowrap; line-height: 1; }
    /* Region / sea / desert names lie flat on the ground and grow with the map (--zs is set from the zoom). */
    .pl-big {
      font-family: 'Aref Ruqaa', serif; font-weight: 700;
      font-size: clamp(9px, calc(var(--s) * 34px * var(--zs, 1)), 130px);
      transition: opacity .6s;
    }
    .pl-region { color: rgba(255, 247, 232, .56); text-shadow: 0 2px 12px rgba(0, 0, 0, .6), 0 0 2px rgba(0, 0, 0, .45); }
    .pl-sea { color: rgba(130, 198, 255, .62); font-weight: 400; text-shadow: 0 0 14px rgba(56, 168, 245, .35); }
    .pl-sand { color: rgba(255, 224, 168, .55); text-shadow: 0 2px 12px rgba(0, 0, 0, .55); }
    /* Sales-region names: white with a dark outline so they read on their own region's colour and on the
       satellite image; only a faint outer glow carries the region colour. The others dim while one is open.
       Fades go on the inner .pl-t: MapLibre writes its own inline opacity on the marker element. */
    .pl-zone {
      color: #fff;
      font-size: clamp(15px, calc(var(--s) * 34px * var(--zs, 1)), 130px);
      text-shadow:
        0 0 2px rgba(2, 6, 23, .95), 0 0 4px rgba(2, 6, 23, .8), 0 2px 10px rgba(2, 6, 23, .75),
        0 0 22px color-mix(in srgb, var(--c) 70%, transparent);
    }
    .pl-t { display: block; transition: opacity .6s; }
    .pl-zone .pl-t { opacity: .96; }
    .pl-zone.dimmed .pl-t { opacity: .4; }
    #map.deep .pl-t { opacity: 0; }
    /* City names stay upright and readable; smaller towns appear as you zoom in. */
    .pl-city { display: flex; align-items: center; gap: 5px; font-weight: 700; font-size: 12px; color: #fff; text-shadow: 0 0 3px rgba(0, 0, 0, .95), 0 1px 7px rgba(0, 0, 0, .85); }
    .pl-city i { width: 5px; height: 5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px rgba(2, 6, 23, .55); }
    .pl-city.r1 { font-size: 14px; font-weight: 800; }
    .pl-city.r1 i { width: 7px; height: 7px; }
    .pl-city.r3 { font-size: 11px; font-weight: 500; color: rgba(255, 255, 255, .88); }
    .pl-city.r3 i { width: 4px; height: 4px; }
    .pl-city.pe { flex-direction: row-reverse; }
    .pl-city.ps { flex-direction: column; gap: 3px; }
    .pl-city.pn { flex-direction: column-reverse; gap: 3px; }

    /* ---------- One pin per sales rep (shown when their region is selected) ---------- */
    .rep-pin { visibility: hidden; width: 14px; height: 14px; cursor: pointer; background: none; border: 0; padding: 0; }
    .rep-pin.on { visibility: visible; }
    .rep-pin-in { position: absolute; inset: 0; opacity: 0; }
    .rp-dot {
      position: absolute; inset: 0; border-radius: 50%; background: #fff;
      box-shadow: 0 0 0 3px var(--c), 0 0 18px 3px var(--c);
    }
    .rp-pill {
      position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 7px;
      padding: 3px 3px 3px 12px; border-radius: 999px; white-space: nowrap;
      transition: transform .25s cubic-bezier(.2, .8, .2, 1), background .25s;
    }
    .rp-pill::after {
      content: ''; position: absolute; top: 100%; left: 50%; width: 2px; height: 9px; transform: translateX(-50%);
      background: linear-gradient(rgba(255, 255, 255, .95), transparent);
    }
    .rp-av {
      display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
      color: #fff; font-weight: 800; font-size: 13px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 3px 8px -3px var(--c);
    }
    .rp-nm { font-size: 13px; font-weight: 700; color: var(--ink); }
    .rep-pin:hover .rp-pill { transform: translateX(-50%) translateY(-3px); }
    .rep-pin.open .rp-pill { background: linear-gradient(135deg, var(--c), var(--c2)); border-color: transparent; }
    .rep-pin.open .rp-nm { color: #fff; }
    .rep-pin.open .rp-av { background: #fff; color: var(--c); }
    @media (max-width: 767px) {
      .rp-pill { gap: 5px; padding: 2px 2px 2px 9px; bottom: 20px; }
      .rp-av { width: 24px; height: 24px; font-size: 12px; }
      .rp-nm { font-size: 11.5px; }
    }

    /* ---------- Rep details card ---------- */
    /* MapLibre's popup layout assumes left-to-right; keep its wrapper LTR and the card itself RTL. */
    .rep-popup { direction: ltr; }
    .rep-popup .rep-card { direction: rtl; }
    .rep-popup .maplibregl-popup-content { background: none; padding: 0; box-shadow: none; border-radius: 0; }
    .rep-popup .maplibregl-popup-tip { display: none; }
    /* MapLibre focuses the card when it opens; keep a ring only for keyboard users. */
    .rep-card :focus { outline: none; }
    .rep-card :focus-visible { outline: 2px solid rgba(255, 255, 255, .85); outline-offset: 2px; }

    /* ---------- Map controls ---------- */
    .maplibregl-ctrl-attrib { background: rgba(255, 255, 255, .7) !important; color: #475569; font-size: 10px; }
    .maplibregl-ctrl-attrib a { color: #0f172a; }
    .maplibregl-ctrl-group { background: var(--paper); border: 1px solid rgba(255,255,255,.75); border-radius: 14px; box-shadow: var(--shadow) !important; overflow: hidden; }
    .maplibregl-ctrl-group button { width: 36px; height: 36px; }
    .maplibregl-ctrl-group button + button { border-top-color: rgba(15, 23, 42, .08); }
    .maplibregl-ctrl-bottom-left .maplibregl-ctrl { margin: 0 0 20px 20px; }
    @media (max-width: 767px) { .maplibregl-ctrl-bottom-left { display: none; } }
  </style>
</head>
<body class="font-sans antialiased">

  <div id="map" aria-label="خريطة المملكة العربية السعودية ثلاثية الأبعاد"></div>
  <div id="vignette"></div>


  <!-- Shown only if the 3D map can't run (no WebGL / offline map library) -->
  <div id="fallback" class="fixed inset-0 z-20 hidden overflow-y-auto bg-slate-950 p-4"></div>

  <!-- Loader -->
  <div id="loader" class="fixed inset-0 z-50 flex flex-col items-center justify-center gap-6 bg-[radial-gradient(circle_at_50%_45%,#0c1f3d,#020617_65%)]">
    <div class="relative grid place-items-center">
      <span class="absolute h-36 w-36 animate-ping rounded-full bg-brand/10"></span>
      <div class="h-24 w-20 rounded-[50%] bg-white p-2 shadow-[0_0_0_6px_rgba(59,167,224,.18),0_0_70px_rgba(59,167,224,.5)]">
        <img src="img/logo.png" alt="" class="h-full w-full object-contain">
      </div>
    </div>
    <div class="text-center">
      <p class="text-xl font-extrabold tracking-wide text-white">شركة المتولي</p>
      <p class="mt-1 text-sm text-slate-400">مندوبو المبيعات في المملكة</p>
    </div>
    <div class="h-[3px] w-44 overflow-hidden rounded-full bg-white/10">
      <div id="loaderBar" class="h-full w-1/3 rounded-full bg-gradient-to-l from-brand to-indigo-400"></div>
    </div>
  </div>

  <script>
    const ZONES = window.ZONES;
    const zoneById = Object.fromEntries(ZONES.map((z) => [z.id, z]));
    const SA_BOUNDS = [[34.5, 16.3], [55.7, 32.2]];

    let map = null;
    let current = null;
    let ready = false; // map loaded and all markers created
    let lastChange = 0; // when a region was last opened or closed
    let flight = null; // camera the last open/close is flying to
    let repPopup = null;
    let openPin = null;
    const zoneLabels = {}; // zone id -> its big name on the map
    const repPins = {}; // zone id -> [{ el, marker, rep }]

    // ---------- helpers ----------
    const intl = (p) => '966' + p.replace(/^0/, '');
    const pretty = (p) => p.replace(/^(\d{3})(\d{3})(\d{4})$/, '$1 $2 $3');
    const zoneColors = () => ['match', ['get', 'zone'], ...ZONES.flatMap((z) => [z.id, z.color]), '#020617'];
    const initial = (name) => name.trim().charAt(0);
    const shortName = (name) => name.trim().split(/\s+/).slice(0, 2).join(' ');
    const tint = (el, z) => { el.style.setProperty('--c', z.color); el.style.setProperty('--c2', z.color2); };
    // With 3D terrain MapLibre fades any marker it thinks a hill hides to 20%; at a phone's tilt the
    // Najd escarpments trip that by mistake, so keep every marker fully visible.
    const MARKER = { opacityWhenCovered: '1' };

    const ICON_CALL = '<svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';
    const ICON_WA = '<svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.65-4.95A9 9 0 1 1 7.95 19.35z"/><path d="M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1"/></svg>';
    const ICON_CLOSE = '<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';

    // ---------- zone geometry ----------
    const zoneFeatures = (id) => window.SA_REGIONS.features.filter((f) => f.properties.zone === id);
    const polygonsOf = (f) => (f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates);

    function zoneBounds(id) {
      let w = 180, s = 90, e = -180, n = -90;
      zoneFeatures(id).forEach((f) => polygonsOf(f).forEach((p) => p[0].forEach(([x, y]) => {
        w = Math.min(w, x); e = Math.max(e, x); s = Math.min(s, y); n = Math.max(n, y);
      })));
      return [[w, s], [e, n]];
    }

    function inRing([x, y], ring) {
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const [xi, yi] = ring[i], [xj, yj] = ring[j];
        if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
      }
      return inside;
    }
    // Outer rings of each zone with their bounding boxes, so most points are rejected without walking the outline.
    const zoneRings = {};
    const ringsOf = (id) => (zoneRings[id] ||= zoneFeatures(id).flatMap((f) => polygonsOf(f).map((p) => {
      const xs = p[0].map((c) => c[0]), ys = p[0].map((c) => c[1]);
      return { ring: p[0], box: [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)] };
    })));
    const inZone = ([x, y], id) => ringsOf(id).some(({ ring, box }) => x >= box[0] && x <= box[2] && y >= box[1] && y <= box[3] && inRing([x, y], ring));

    // Reps have no addresses in the source file, so unless a rep has `at`, their pins are spread evenly over
    // the whole zone: sample a grid of points that sit safely inside the border (sized in screen pixels for
    // the zoom the zone opens at), start near the centre, then keep adding the point farthest from those taken.
    // Layouts only depend on the zone and the screen size, so each is worked out once.
    const pinCache = {};
    function layoutPins(z, cam) {
      const key = `${z.id}:${innerWidth}x${innerHeight}`;
      const spots = (pinCache[key] ||= spreadPins(z, cam));
      repPins[z.id].forEach(({ marker }, i) => marker.setLngLat(spots[i]));
    }

    function spreadPins(z, cam) {
      const degPerPx = 360 / (512 * 2 ** cam.zoom);
      const cosLat = Math.cos((cam.center.lat * Math.PI) / 180);
      const step = 18 * degPerPx;
      const m = (narrow() ? 20 : 36) * degPerPx; // keep pins this many px inside the border
      const safe = ([x, y]) => [[0, 0], [m, 0], [-m, 0], [0, m * cosLat], [0, -m * cosLat]].every(([dx, dy]) => inZone([x + dx, y + dy], z.id));
      const [[w, s], [e, n]] = z.bounds;
      const cands = [];
      for (let x = w; x <= e; x += step) for (let y = s; y <= n; y += step * cosLat) if (safe([x, y])) cands.push([x, y]);
      // Distance in on-screen pixels, scaled by the pin's footprint (a wide name pill above the dot; the tilt
      // squashes vertical distances), so pins spread out where their labels need room.
      const [fw, fh] = narrow() ? [108, 50] : [124, 56];
      const dist = (a, b) => Math.hypot((a[0] - b[0]) / degPerPx / fw, ((a[1] - b[1]) / degPerPx / cosLat) * 0.75 / fh);

      const fixed = z.reps.filter((r) => r.at).map((r) => r.at);
      const centre = [cam.center.lng, cam.center.lat];
      const spots = [];
      const taken = () => [...fixed, ...spots];
      while (spots.length < z.reps.length - fixed.length && cands.length) {
        let best = 0, bestScore = -Infinity;
        cands.forEach((p, i) => {
          const score = taken().length ? Math.min(...taken().map((q) => dist(p, q))) : -dist(p, centre);
          if (score > bestScore) { bestScore = score; best = i; }
        });
        spots.push(cands.splice(best, 1)[0]);
      }
      let k = 0;
      return z.reps.map((rep) => rep.at || spots[k++] || centre);
    }

    // ---------- camera ----------
    const narrow = () => innerWidth < 768;

    function overviewCamera() {
      const cam = map.cameraForBounds(SA_BOUNDS, { padding: narrow() ? 12 : 60 });
      return { center: cam.center, zoom: cam.zoom, pitch: narrow() ? 28 : 40, bearing: 0 };
    }

    // Centre the selected region and fit all of it on screen. cameraForBounds ignores the 3D tilt, so we
    // jump to the target view, measure where the region's outline really lands, correct, and jump back —
    // all before the next frame is drawn, so nothing flickers.
    let measuring = false;
    const zonePadding = () => (narrow() ? { top: 70, bottom: 110, left: 24, right: 24 } : { top: 90, bottom: 120, left: 90, right: 90 });
    const camCache = {};
    function zoneCamera(z) {
      const key = `${z.id}:${innerWidth}x${innerHeight}`;
      return (camCache[key] ||= measureZoneCamera(z));
    }

    function measureZoneCamera(z) {
      const pad = zonePadding();
      const W = map.getCanvas().clientWidth, H = map.getCanvas().clientHeight;
      const availW = W - pad.left - pad.right, availH = H - pad.top - pad.bottom;
      const verts = zoneFeatures(z.id).flatMap((f) => polygonsOf(f).flatMap((p) => p[0]));
      const start = { center: map.getCenter(), zoom: map.getZoom(), pitch: map.getPitch(), bearing: map.getBearing() };
      const first = map.cameraForBounds(z.bounds);
      let cam = { center: first.center, zoom: first.zoom, pitch: 45, bearing: 0 };
      measuring = true;
      for (let i = 0; i < 3; i++) {
        map.jumpTo(cam);
        let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
        verts.forEach((v) => { const q = map.project(v); x0 = Math.min(x0, q.x); x1 = Math.max(x1, q.x); y0 = Math.min(y0, q.y); y1 = Math.max(y1, q.y); });
        const shift = [(x0 + x1) / 2 - (pad.left + availW / 2), (y0 + y1) / 2 - (pad.top + availH / 2)];
        cam = {
          ...cam,
          center: map.unproject([W / 2 + shift[0], H / 2 + shift[1]]),
          zoom: cam.zoom + Math.log2(Math.min(availW / (x1 - x0), availH / (y1 - y0))),
        };
      }
      map.jumpTo(start);
      measuring = false;
      return cam;
    }

    // ---------- selection ----------
    function selectZone(id) {
      // On a slow connection the loader can lift before the map has loaded; ignore taps until the pins exist.
      if (!ready || id === current) return;
      closeRep();
      const prev = current;
      current = id;
      lastChange = performance.now();
      const z = id ? zoneById[id] : null;
      history.replaceState(null, '', id ? '#' + id : location.pathname + location.search);

      Object.entries(zoneLabels).forEach(([zid, el]) => el.classList.toggle('dimmed', !!id && zid !== id));
      const cam = z ? zoneCamera(z) : overviewCamera();
      if (prev) hidePins(prev);
      if (z) { layoutPins(z, cam); showPins(z.id); }
      paintZones(id);
      flight = cam;
      map.flyTo({ ...cam, duration: 1700, curve: 1.3, essential: true });
    }

    function showPins(id) {
      const pins = repPins[id].map((p) => p.el);
      pins.forEach((el) => el.classList.add('on'));
      gsap.fromTo(pins.map((el) => el.firstElementChild),
        { autoAlpha: 0, scale: 0.3, y: -20 },
        { autoAlpha: 1, scale: 1, y: 0, duration: 0.6, stagger: 0.06, delay: 0.9, ease: 'back.out(1.8)' });
    }

    function hidePins(id) {
      const pins = repPins[id].map((p) => p.el);
      gsap.to(pins.map((el) => el.firstElementChild), {
        autoAlpha: 0, scale: 0.5, duration: 0.25,
        onComplete: () => { if (current !== id) pins.forEach((el) => el.classList.remove('on')); },
      });
    }

    function openRep(z, rep, at, pin) {
      closeRep();
      openPin = pin;
      pin.classList.add('open');
      // Open the card above the pin (clearing its name pill) or below it near the top of the screen,
      // and slide it sideways near the screen edges so it always stays fully visible.
      const CARD_W = 268, CARD_H = 210;
      const pt = map.project(at);
      const W = map.getCanvas().clientWidth;
      const below = pt.y < CARD_H + 80;
      const side = pt.x < CARD_W / 2 + 12 ? '-left' : pt.x > W - CARD_W / 2 - 12 ? '-right' : '';
      const anchor = (below ? 'top' : 'bottom') + side;
      const dx = side === '-left' ? -Math.min(pt.x - 12, 40) : side === '-right' ? Math.min(W - pt.x - 12, 40) : 0;
      repPopup = new maplibregl.Popup({ anchor, offset: [dx, below ? 16 : -60], closeButton: false, closeOnClick: false, maxWidth: 'none', className: 'rep-popup' })
        .setLngLat(at)
        .setHTML(`
          <div class="rep-card w-[268px] overflow-hidden rounded-[22px] bg-white font-sans text-slate-900 shadow-[0_30px_70px_-18px_rgba(0,0,0,.85)] ring-1 ring-black/5">
            <div class="grad relative flex items-center gap-3 p-3.5 text-white" style="--c:${z.color};--c2:${z.color2}">
              <span class="pointer-events-none absolute -left-6 -top-10 h-28 w-28 rounded-full bg-white/15 blur-xl"></span>
              <span class="relative grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-white/20 text-xl font-black ring-1 ring-white/40">${initial(rep.name)}</span>
              <div class="relative min-w-0 flex-1">
                <p class="truncate text-[17px] font-extrabold leading-tight">${rep.name}</p>
                <p class="mt-0.5 truncate text-xs text-white/80">${z.name}</p>
              </div>
              <button type="button" data-close aria-label="إغلاق" class="relative grid h-8 w-8 shrink-0 place-items-center rounded-full bg-white/15 transition hover:bg-white/30">${ICON_CLOSE}</button>
            </div>
            <div class="p-3.5">
              <p class="text-[11px] font-medium text-slate-400">رقم الجوال</p>
              <p class="mb-3 text-[19px] font-bold tabular-nums tracking-wide" dir="ltr" style="text-align:right">${pretty(rep.phone)}</p>
              <div class="grid grid-cols-2 gap-2">
                <a href="tel:+${intl(rep.phone)}" class="flex h-11 items-center justify-center gap-2 rounded-xl bg-slate-900 text-sm font-bold text-white transition hover:bg-slate-800">${ICON_CALL}اتصال</a>
                <a href="https://wa.me/${intl(rep.phone)}" target="_blank" rel="noopener" class="flex h-11 items-center justify-center gap-2 rounded-xl bg-[#25D366] text-sm font-bold text-white shadow-[0_8px_18px_-8px_#25D366] transition hover:brightness-105">${ICON_WA}واتساب</a>
              </div>
            </div>
          </div>`)
        .addTo(map);
      const el = repPopup.getElement();
      el.querySelector('[data-close]').addEventListener('click', closeRep);
      gsap.fromTo(el.querySelector('.rep-card'), { autoAlpha: 0, scale: 0.92, y: 8 }, { autoAlpha: 1, scale: 1, y: 0, duration: 0.4, ease: 'back.out(1.6)' });
    }

    function closeRep() {
      openPin?.classList.remove('open');
      openPin = null;
      repPopup?.remove();
      repPopup = null;
    }

    // Kept deliberately light so the satellite detail, roads and names stay readable everywhere.
    // Overview: each sales region gets a faint tint of its colour, the rest of the Kingdom a faint shade.
    // A region open: a faint tint and a soft outline on it, a light shade over everything else.
    function paintZones(sel) {
      if (!sel) {
        map.setPaintProperty('zone-fill', 'fill-color', zoneColors());
        map.setPaintProperty('zone-fill', 'fill-opacity', ['match', ['get', 'zone'], 'other', 0.28, 0.26]);
        map.setPaintProperty('zone-glow', 'line-opacity', 0);
        map.setPaintProperty('zone-line', 'line-opacity', 0.35);
        map.setPaintProperty('zone-line', 'line-width', 1);
        return;
      }
      map.setPaintProperty('zone-fill', 'fill-color', ['match', ['get', 'zone'], sel, zoneById[sel].color, '#020617']);
      map.setPaintProperty('zone-fill', 'fill-opacity', ['match', ['get', 'zone'], sel, 0.12, 0.42]);
      map.setPaintProperty('zone-glow', 'line-opacity', ['match', ['get', 'zone'], sel, 0.6, 0]);
      map.setPaintProperty('zone-line', 'line-opacity', ['match', ['get', 'zone'], sel, 0.85, 0.15]);
      map.setPaintProperty('zone-line', 'line-width', ['match', ['get', 'zone'], sel, 2, 1.2]);
    }

    // ---------- map ----------
    function initMap() {
      // Joins Arabic letters correctly in the map's own labels (loaded the first time Arabic text appears).
      if (maplibregl.getRTLTextPluginStatus() === 'unavailable') {
        Promise.resolve(maplibregl.setRTLTextPlugin('https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.3.0/dist/mapbox-gl-rtl-text.js', true)).catch(() => {});
      }
      const name = ['coalesce', ['get', 'name:ar'], ['get', 'name']];
      // Roads and names only inside the Kingdom; other countries show just the dimmed satellite image.
      const inSA = ['within', window.SA_CLIP];
      const halo = { 'text-color': '#ffffff', 'text-halo-color': 'rgba(0, 0, 0, .85)', 'text-halo-width': 1.4, 'text-halo-blur': 0.4 };

      map = new maplibregl.Map({
        container: 'map',
        bounds: SA_BOUNDS, fitBoundsOptions: { padding: 40 },
        bearing: -20,
        minZoom: 1, maxZoom: 15, maxPitch: 75,
        // Performance: phones with 3× screens would otherwise draw 9× the pixels; no repeated world copies.
        pixelRatio: Math.min(window.devicePixelRatio || 1, narrow() ? 1.5 : 2),
        renderWorldCopies: false,
        attributionControl: { compact: true },
        style: {
          version: 8,
          // Dark sky behind the tilted horizon.
          sky: {
            'sky-color': '#020617',
            'sky-horizon-blend': 0.5,
            'horizon-color': '#0c2340',
            'horizon-fog-blend': 0.8,
            'fog-color': '#020617',
            'fog-ground-blend': 0.6,
          },
          glyphs: 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
          // Hybrid map, like Google's: satellite imagery with roads, road numbers and Arabic place names on top.
          sources: {
            satellite: {
              type: 'raster',
              tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
              tileSize: 256, maxzoom: 19,
              attribution: 'Imagery © Esri, Maxar, Earthstar Geographics',
            },
            osm: {
              type: 'vector',
              url: 'https://tiles.openfreemap.org/planet',
              attribution: '<a href="https://openfreemap.org">OpenFreeMap</a> © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            },
            // One elevation source for the 3D relief; zoom 11 detail is plenty at the zooms this page uses.
            terrain: {
              type: 'raster-dem',
              tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
              tileSize: 256, encoding: 'terrarium', maxzoom: 11,
              attribution: 'Terrain © Mapzen, AWS Open Data',
            },
            regions: { type: 'geojson', data: window.SA_REGIONS, attribution: 'Boundaries © geoBoundaries' },
            mask: { type: 'geojson', data: window.SA_MASK },
          },
          layers: [
            { id: 'satellite', type: 'raster', source: 'satellite', paint: { 'raster-contrast': 0.08, 'raster-resampling': 'linear' } },
            { id: 'zone-fill', type: 'fill', source: 'regions', paint: { 'fill-color': zoneColors(), 'fill-opacity': 0.1, 'fill-opacity-transition': { duration: 900 }, 'fill-color-transition': { duration: 900 } } },
            // Roads: highways in yellow, main roads pale, local roads appear as you zoom in.
            { id: 'road-minor', type: 'line', source: 'osm', 'source-layer': 'transportation', minzoom: 8,
              filter: ['all', inSA, ['in', ['get', 'class'], ['literal', ['secondary', 'tertiary', 'minor']]]],
              layout: { 'line-join': 'round', 'line-cap': 'round' },
              paint: { 'line-color': '#ffffff', 'line-opacity': 0.55, 'line-width': ['interpolate', ['linear'], ['zoom'], 9, 0.4, 14, 2.4] } },
            { id: 'road-primary', type: 'line', source: 'osm', 'source-layer': 'transportation', minzoom: 6,
              filter: ['all', inSA, ['==', ['get', 'class'], 'primary']],
              layout: { 'line-join': 'round', 'line-cap': 'round' },
              paint: { 'line-color': '#fff1bf', 'line-opacity': 0.8, 'line-width': ['interpolate', ['linear'], ['zoom'], 6, 0.5, 14, 3.5] } },
            { id: 'road-major', type: 'line', source: 'osm', 'source-layer': 'transportation', minzoom: 4,
              filter: ['all', inSA, ['in', ['get', 'class'], ['literal', ['motorway', 'trunk']]]],
              layout: { 'line-join': 'round', 'line-cap': 'round' },
              paint: { 'line-color': '#f7cf5e', 'line-opacity': 0.9, 'line-width': ['interpolate', ['linear'], ['zoom'], 4, 0.5, 8, 1.6, 14, 5] } },
            // Road numbers, as small green tags.
            { id: 'road-shield', type: 'symbol', source: 'osm', 'source-layer': 'transportation_name', minzoom: 7,
              filter: ['all', inSA, ['has', 'ref'], ['in', ['get', 'class'], ['literal', ['motorway', 'trunk', 'primary']]]],
              layout: { 'symbol-placement': 'line', 'symbol-spacing': 420, 'text-field': ['get', 'ref'], 'text-font': ['Noto Sans Bold'], 'text-size': 10, 'text-rotation-alignment': 'viewport', 'text-padding': 8 },
              paint: { 'text-color': '#ffffff', 'text-halo-color': '#2e7d32', 'text-halo-width': 3 } },
            // Place names in Arabic: cities from the start, towns and villages as you zoom in.
            { id: 'place-village', type: 'symbol', source: 'osm', 'source-layer': 'place', minzoom: 8,
              filter: ['all', inSA, ['in', ['get', 'class'], ['literal', ['village', 'suburb', 'hamlet']]]],
              layout: { 'text-field': name, 'text-font': ['Noto Sans Regular'], 'text-size': 11 },
              paint: halo },
            { id: 'place-town', type: 'symbol', source: 'osm', 'source-layer': 'place', minzoom: 5,
              filter: ['all', inSA, ['==', ['get', 'class'], 'town']],
              layout: { 'text-field': name, 'text-font': ['Noto Sans Regular'], 'text-size': ['interpolate', ['linear'], ['zoom'], 5, 10, 12, 14] },
              paint: halo },
            { id: 'place-city', type: 'symbol', source: 'osm', 'source-layer': 'place', minzoom: 4.5,
              filter: ['all', inSA, ['==', ['get', 'class'], 'city']],
              layout: { 'text-field': name, 'text-font': ['Noto Sans Bold'], 'text-size': ['interpolate', ['linear'], ['zoom'], 4.5, 11, 10, 17] },
              paint: halo },
            { id: 'borders', type: 'line', source: 'regions', paint: { 'line-color': '#ffffff', 'line-opacity': 0.14, 'line-width': 0.7 } },
            { id: 'zone-glow', type: 'line', source: 'regions', filter: ['!=', ['get', 'zone'], 'other'], layout: { 'line-join': 'round' }, paint: { 'line-color': zoneColors(), 'line-width': 9, 'line-blur': 7, 'line-opacity': 0.5, 'line-opacity-transition': { duration: 900 } } },
            { id: 'zone-line', type: 'line', source: 'regions', filter: ['!=', ['get', 'zone'], 'other'], layout: { 'line-join': 'round' }, paint: { 'line-color': zoneColors(), 'line-width': 1.6, 'line-opacity': 0.9, 'line-opacity-transition': { duration: 900 } } },
            // Everything outside the Kingdom is dimmed (still visible) so Saudi Arabia stands out bright.
            { id: 'mask', type: 'fill', source: 'mask', paint: { 'fill-color': '#020617', 'fill-opacity': 0.65, 'fill-antialias': false } },
          ],
        },
      });

      map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-left');
      // A quick double tap is two taps on a region here, not a zoom gesture (pinch and +/− still zoom).
      map.doubleClickZoom.disable();

      // Set up as soon as the style is ready — markers and taps don't need any tiles — instead of waiting for
      // 'load', which also waits for every first imagery and terrain tile. The loader stays up for 'load'.
      const setup = () => {
        if (ready) return;
        map.setTerrain({ source: 'terrain', exaggeration: 1.8 });
        paintZones(current);
        addPlaces();
        addMarkers();
        ready = true;
        startCamera();
      };
      if (map.isStyleLoaded()) setup(); else map.once('style.load', setup);
      map.once('load', () => {
        setup();
        intro();
        // MapLibre expands the credits on load; start them collapsed behind the (i) button.
        document.querySelector('.maplibregl-ctrl-attrib')?.classList.remove('maplibregl-compact-show');
      });

      // Tap a sales region to open it; tap the open region again to close it (a first tap only closes an open
      // rep card). Anywhere else (outside the Kingdom or a region with no reps) zooms back out.
      map.on('click', (e) => {
        if (e.originalEvent.target !== map.getCanvas()) return;
        // The second tap of a quick double tap would undo the first (open, then straight back out), and pressing
        // the map cancels the camera flight. So ignore that tap and carry the flight on to where it was going.
        if (performance.now() - lastChange < 700) {
          map.flyTo({ ...flight, duration: 1200, curve: 1.3, essential: true });
          return;
        }
        const zone = map.queryRenderedFeatures(e.point, { layers: ['zone-fill'] })[0]?.properties.zone;
        if (zone && zone === current) { if (repPopup) closeRep(); else selectZone(null); }
        else if (zone && zone !== 'other') selectZone(zone);
        else if (current) selectZone(null);
        else map.flyTo({ ...overviewCamera(), duration: 1800, essential: true });
      });
      map.on('mousemove', (e) => {
        const zone = map.queryRenderedFeatures(e.point, { layers: ['zone-fill'] })[0]?.properties.zone;
        map.getCanvas().style.cursor = zone && zone !== 'other' && zone !== current ? 'pointer' : current ? 'zoom-out' : '';
      });
    }

    // Place names go in first so the rep pins and cards always sit on top of them.
    function addPlaces() {
      const { regions = [], features = [], cities = [] } = window.PLACES;
      const flat = (p, cls) => {
        const el = document.createElement('div');
        el.className = `pl pl-big ${cls}`;
        el.style.setProperty('--s', p.size || 1);
        el.innerHTML = `<span class="pl-t">${p.name}</span>`;
        new maplibregl.Marker({ ...MARKER, element: el, pitchAlignment: 'map', rotationAlignment: 'map', rotation: p.rotate || 0 }).setLngLat(p.at).addTo(map);
        return el;
      };
      regions.forEach((p) => {
        const z = zoneById[p.zone];
        const el = flat(p, z ? 'pl-zone' : 'pl-region');
        if (z) { tint(el, z); zoneLabels[z.id] = el; }
      });
      features.forEach((p) => flat(p, p.kind === 'sea' ? 'pl-sea' : 'pl-sand'));
      // Fade the names in, then hand opacity back to the stylesheet so dimming works.
      gsap.from('.pl-zone .pl-t', { autoAlpha: 0, duration: 1.2, stagger: 0.2, delay: 2.2, ease: 'power2.out', clearProps: 'opacity,visibility' });

      const RANK_ZOOM = { 1: 0, 2: 4.6, 3: 6.4 };
      const cityEls = cities.map((c) => {
        const el = document.createElement('div');
        const pos = c.pos || 'w';
        el.className = `pl pl-city r${c.rank} p${pos}`;
        el.innerHTML = `<i></i>${c.name}`;
        const r = c.rank === 1 ? 3.5 : 2.5; // half the dot, so the dot sits on the city
        const opts = {
          w: { anchor: 'right', offset: [r, 0] },
          e: { anchor: 'left', offset: [-r, 0] },
          s: { anchor: 'top', offset: [0, -r] },
          n: { anchor: 'bottom', offset: [0, r] },
        }[pos];
        new maplibregl.Marker({ ...MARKER, element: el, ...opts }).setLngLat(c.at).addTo(map);
        return { el, minZoom: c.minZoom ?? RANK_ZOOM[c.rank] };
      });

      const sync = () => {
        const z = map.getZoom();
        const box = map.getContainer();
        box.style.setProperty('--zs', 2 ** (z - 5));
        box.classList.toggle('deep', z >= 8.3);
        cityEls.forEach(({ el, minZoom }) => { el.style.display = z >= minZoom ? '' : 'none'; });
      };
      map.on('zoom', sync);
      sync();
    }

    function addMarkers() {
      ZONES.forEach((z) => {
        // Positioned by layoutPins() each time the zone opens.
        repPins[z.id] = z.reps.map((rep) => {
          const pin = document.createElement('button');
          pin.type = 'button';
          pin.className = 'rep-pin';
          tint(pin, z);
          pin.setAttribute('aria-label', `${rep.name} ${rep.phone}`);
          pin.innerHTML = `
            <span class="rep-pin-in">
              <span class="rp-dot"></span>
              <span class="rp-pill paper"><span class="rp-av grad">${initial(rep.name)}</span><span class="rp-nm">${shortName(rep.name)}</span></span>
            </span>`;
          const marker = new maplibregl.Marker({ ...MARKER, element: pin }).setLngLat(z.marker).addTo(map);
          pin.addEventListener('click', (e) => { e.stopPropagation(); openRep(z, rep, marker.getLngLat(), pin); });
          return { el: pin, marker, rep };
        });
      });
    }

    // Opening camera move: straight to the zone in the URL (e.g. index.html#east), else the whole Kingdom.
    function startCamera() {
      const fromHash = zoneById[location.hash.slice(1)];
      if (fromHash) selectZone(fromHash.id);
      else map.flyTo({ ...overviewCamera(), duration: 3800, curve: 1.4, essential: true });
      map.once('moveend', warmCaches);
    }

    // Work out each region's camera and pin layout ahead of time, one per idle moment and only while the map
    // is still (measuring briefly moves the camera), so the first tap on a region opens it instantly.
    function warmCaches() {
      const todo = ZONES.filter((z) => !camCache[`${z.id}:${innerWidth}x${innerHeight}`]);
      if (!todo.length) return;
      const idle = window.requestIdleCallback || ((fn) => setTimeout(fn, 200));
      idle(() => {
        if (map.isMoving()) return map.once('moveend', warmCaches);
        const z = todo[0];
        layoutPins(z, zoneCamera(z));
        warmCaches();
      });
    }

    // ---------- no-map fallback: plain list of every region ----------
    function renderFallback() {
      const el = document.getElementById('fallback');
      el.innerHTML = `<div class="mx-auto max-w-md space-y-4 py-4">${ZONES.map((z) => `
        <section class="overflow-hidden rounded-3xl bg-white text-slate-900 shadow-xl">
          <h2 class="grad px-4 py-3 text-lg font-extrabold text-white" style="--c:${z.color};--c2:${z.color2}">${z.name}</h2>
          <ul class="divide-y divide-slate-100 px-2">${z.reps.map((r) => `
            <li class="flex items-center gap-2.5 px-2 py-2.5">
              <span class="min-w-0 flex-1">
                <span class="block truncate font-bold">${r.name}</span>
                <span class="block text-sm tabular-nums text-slate-500" dir="ltr" style="text-align:right">${pretty(r.phone)}</span>
              </span>
              <a href="https://wa.me/${intl(r.phone)}" target="_blank" rel="noopener" aria-label="واتساب ${r.name}" class="grid h-10 w-10 place-items-center rounded-xl bg-[#25D366] text-white">${ICON_WA}</a>
              <a href="tel:+${intl(r.phone)}" aria-label="اتصال ${r.name}" class="grid h-10 w-10 place-items-center rounded-xl bg-slate-900 text-white">${ICON_CALL}</a>
            </li>`).join('')}</ul>
        </section>`).join('')}</div>`;
      el.classList.remove('hidden');
    }

    // ---------- intro ----------
    let introPlayed = false;
    function intro() {
      if (introPlayed) return;
      introPlayed = true;
      gsap.killTweensOf('#loaderBar');
      gsap.to('#loader', { autoAlpha: 0, scale: 1.04, duration: 0.8, ease: 'power2.inOut' });
    }

    // ---------- boot ----------
    ZONES.forEach((z) => { z.bounds = zoneBounds(z.id); });
    gsap.to('#loaderBar', { xPercent: 200, duration: 1.1, repeat: -1, ease: 'power1.inOut' });
    try {
      if (!window.maplibregl) throw new Error('map library unavailable');
      initMap();
    } catch (err) {
      console.warn('Map disabled:', err);
      map = null;
      renderFallback();
      intro();
    }
    // Never leave the visitor stuck on the loader if tiles are slow.
    setTimeout(intro, 8000);
    addEventListener('keydown', (e) => {
      if (e.key !== 'Escape' || !current) return;
      if (repPopup) closeRep(); else selectZone(null);
    });
    addEventListener('resize', () => {
      if (map) map.easeTo({ ...(current ? zoneCamera(zoneById[current]) : overviewCamera()), duration: 600 });
    });
  </script>
</body>
</html>
